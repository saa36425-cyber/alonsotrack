<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlonsoTrack – Historial de Mantenimiento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3097/3097180.png">
  <meta name="theme-color" content="#1e40af">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .card { @apply bg-white rounded-xl shadow-sm border border-gray-100; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- LOGIN ADMIN -->
  <div id="login-view" class="min-h-screen flex items-center justify-center p-4">
    <div class="card w-full max-w-md p-8">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-blue-800">AlonsoTrack</h1>
        <p class="text-gray-500 mt-1">Historial de mantenimiento</p>
      </div>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
          <input type="text" id="login-user" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          <input type="password" id="login-pass" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-medium py-2.5 rounded-lg transition">Ingresar</button>
      </form>
      <div class="mt-6 pt-6 border-t text-center">
        <button onclick="showClientAccess()" class="text-blue-600 hover:underline text-sm">¿Sos cliente? Consultá tu historial →</button>
      </div>
    </div>
  </div>

  <!-- ACCESO CLIENTE -->
  <div id="client-access-view" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="card w-full max-w-md p-8">
      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-blue-800">Consultar historial</h1>
        <p class="text-gray-500 mt-1">Ingresá la placa y el código que te dio el taller</p>
      </div>
      <form id="client-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Placa</label>
          <input type="text" id="client-plate" placeholder="ABC123" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 uppercase focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Código de acceso</label>
          <input type="text" id="client-code" placeholder="XXXXXX" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 uppercase focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-medium py-2.5 rounded-lg">Ver historial</button>
      </form>
      <div class="mt-6 text-center">
        <button onclick="showLogin()" class="text-gray-500 hover:underline text-sm">← Volver al login del taller</button>
      </div>
    </div>
  </div>

  <!-- APP PRINCIPAL (ADMIN) -->
  <div id="app-view" class="hidden">
    <!-- Header -->
    <header class="bg-blue-800 text-white sticky top-0 z-50 shadow">
      <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <h1 class="text-xl font-bold">AlonsoTrack</h1>
          <span class="text-blue-200 text-sm hidden sm:inline">Taller de Santiago Alonso</span>
        </div>
        <div class="flex items-center gap-3">
          <span id="admin-name" class="text-sm"></span>
          <button onclick="logout()" class="text-sm bg-blue-700 hover:bg-blue-600 px-3 py-1.5 rounded">Salir</button>
        </div>
      </div>
    </header>

    <!-- Nav -->
    <nav class="bg-white border-b sticky top-14 z-40">
      <div class="max-w-6xl mx-auto px-4 flex gap-1 overflow-x-auto">
        <button onclick="showSection('dashboard')" class="nav-btn px-4 py-3 text-sm font-medium border-b-2 border-blue-700 text-blue-700" data-section="dashboard">Inicio</button>
        <button onclick="showSection('clients')" class="nav-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-gray-600 hover:text-blue-700" data-section="clients">Clientes</button>
        <button onclick="showSection('vehicles')" class="nav-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-gray-600 hover:text-blue-700" data-section="vehicles">Vehículos</button>
      </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-6">
      <!-- DASHBOARD -->
      <section id="section-dashboard" class="space-y-6">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div class="card p-5">
            <p class="text-sm text-gray-500">Clientes</p>
            <p id="stat-clients" class="text-3xl font-bold text-blue-800">0</p>
          </div>
          <div class="card p-5">
            <p class="text-sm text-gray-500">Vehículos</p>
            <p id="stat-vehicles" class="text-3xl font-bold text-blue-800">0</p>
          </div>
        </div>

        <div class="grid md:grid-cols-2 gap-6">
          <div class="card p-5">
            <h2 class="font-semibold text-lg mb-4">Próximos mantenimientos</h2>
            <div id="upcoming-list" class="space-y-3 text-sm"></div>
          </div>
          <div class="card p-5">
            <h2 class="font-semibold text-lg mb-4">Últimos trabajos</h2>
            <div id="recent-list" class="space-y-3 text-sm"></div>
          </div>
        </div>
      </section>

      <!-- CLIENTES -->
      <section id="section-clients" class="hidden space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="text-xl font-bold">Clientes</h2>
