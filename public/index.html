<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taller Mecánico</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .card { @apply bg-white rounded-xl shadow-sm border border-gray-100; }

    /* Evita que el celular seleccione texto al hacer tap */
    button, a, .cursor-pointer {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="app" class="max-w-4xl mx-auto p-4 md:p-6 pb-24">
    <!-- Encabezado -->
    <header class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Taller Mecánico</h1>
      <button onclick="logout()" class="text-sm text-red-600 hover:underline">Cerrar sesión</button>
    </header>

    <!-- Pestañas de navegación -->
    <nav class="flex gap-2 mb-6 border-b border-gray-200">
      <button onclick="switchTab('vehicles')" id="tab-vehicles" class="px-4 py-2 font-medium border-b-2 border-blue-600 text-blue-600">Vehículos</button>
      <button onclick="switchTab('clients')" id="tab-clients" class="px-4 py-2 font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700">Clientes</button>
      <button onclick="switchTab('services')" id="tab-services" class="px-4 py-2 font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700">Servicios</button>
    </nav>

    <!-- Vista: Vehículos -->
    <section id="sec-vehicles" class="space-y-4">
      <div class="flex justify-between items-center">
        <input type="text" id="search-input" placeholder="Buscar por patente, cliente, marca..." class="w-full md:w-64 px-3 py-2 border rounded-lg" onkeyup="filterVehicles()">
        <button onclick="openVehicleModal()" class="ml-2 bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700">+ Nuevo Vehículo</button>
      </div>
      <div class="card overflow-hidden">
        <div id="vehicles-list" class="divide-y divide-gray-100">
          <!-- Se cargan dinámicamente -->
        </div>
      </div>
    </section>

    <!-- Vista: Clientes -->
    <section id="sec-clients" class="hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold">Clientes</h2>
        <button onclick="openClientModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700">+ Nuevo Cliente</button>
      </div>
      <div class="card overflow-hidden">
        <div id="clients-list" class="divide-y divide-gray-100">
          <!-- Se cargan dinámicamente -->
        </div>
      </div>
    </section>

    <!-- Vista: Servicios -->
    <section id="sec-services" class="hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold">Catálogo de Servicios</h2>
        <button onclick="openServiceModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700">+ Nuevo Servicio</button>
      </div>
      <div class="card overflow-hidden">
        <div id="services-list" class="divide-y divide-gray-100">
          <!-- Se cargan dinámicamente -->
        </div>
      </div>
    </section>
  </div>

  <!-- Modal: Nuevo/Editar Vehículo -->
  <div id="modal-vehicle" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-md w-full p-6 space-y-4">
      <h3 class="text-lg font-bold" id="modal-vehicle-title">Nuevo Vehículo</h3>
      <form id="form-vehicle" onsubmit="saveVehicle(event)">
        <input type="hidden" id="v-id">
        <div class="space-y-3">
          <div>
            <label class="block text-sm font-medium">Patente</label>
            <input type="text" id="v-plate" required class="w-full border rounded-lg px-3 py-2 uppercase">
          </div>
          <div>
            <label class="block text-sm font-medium">Cliente</label>
            <select id="v-client" class="w-full border rounded-lg px-3 py-2"></select>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-sm font-medium">Marca</label>
              <input type="text" id="v-brand" class="w-full border rounded-lg px-3 py-2">
            </div>
            <div>
              <label class="block text-sm font-medium">Modelo</label>
              <input type="text" id="v-model" class="w-full border rounded-lg px-3 py-2">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-sm font-medium">Año</label>
              <input type="number" id="v-year" class="w-full border rounded-lg px-3 py-2">
            </div>
            <div>
              <label class="block text-sm font-medium">Kilometraje</label>
              <input type="number" id="v-km" class="w-full border rounded-lg px-3 py-2">
            </div>
          </div>
        </div>
        <div class="flex justify-end gap-2 mt-6">
          <button type="button" onclick="closeModal('modal-vehicle')" class="px-4 py-2 border rounded-lg">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Cliente -->
  <div id="modal-client" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-md w-full p-6 space-y-4">
      <h3 class="text-lg font-bold" id="modal-client-title">Nuevo Cliente</h3>
      <form id="form-client" onsubmit="saveClient(event)">
        <input type="hidden" id="c-id">
        <div class="space-y-3">
          <div>
            <label class="block text-sm font-medium">Nombre Completo</label>
            <input type="text" id="c-name" required class="w-full border rounded-lg px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium">Teléfono</label>
            <input type="text" id="c-phone" class="w-full border rounded-lg px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium">Email</label>
            <input type="email" id="c-email" class="w-full border rounded-lg px-3 py-2">
          </div>
        </div>
        <div class="flex justify-end gap-2 mt-6">
          <button type="button" onclick="closeModal('modal-client')" class="px-4 py-2 border rounded-lg">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Detalle del Vehículo -->
  <div id="modal-detail" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-xl max-w-2xl w-full p-6 space-y-6 my-8">
      <div class="flex justify-between items-start border-b pb-4">
        <div>
          <h2 class="text-2xl font-bold" id="detail-plate">---</h2>
          <p class="text-gray-600" id="detail-subtitle">---</p>
        </div>
        <button onclick="closeModal('modal-detail')" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      </div>

      <!-- Ficha de mantenimiento rápido -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 bg-gray-50 p-4 rounded-lg">
        <div>
          <span class="text-xs text-gray-500 uppercase font-medium">Aceite Motor</span>
          <p class="font-semibold text-gray-800" id="status-oil">--</p>
        </div>
        <div>
          <span class="text-xs text-gray-500 uppercase font-medium">Filtro Aire</span>
          <p class="font-semibold text-gray-800" id="status-filter-air">--</p>
        </div>
        <div>
          <span class="text-xs text-gray-500 uppercase font-medium">Filtro Nafta/Diésel</span>
          <p class="font-semibold text-gray-800" id="status-filter-fuel">--</p>
        </div>
        <div>
          <span class="text-xs text-gray-500 uppercase font-medium">Correa Distribución</span>
          <p class="font-semibold text-gray-800" id="status-belt">--</p>
        </div>
      </div>

      <!-- Registrar Trabajo -->
      <div class="border-t pt-4">
        <h4 class="font-bold mb-3">Registrar Nuevo Trabajo</h4>
        <form id="form-work" onsubmit="saveWork(event)" class="space-y-3">
          <input type="hidden" id="w-vehicle-id">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-gray-600">Servicio</label>
              <select id="w-service" class="w-full border rounded-lg px-3 py-2 text-sm" required></select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600">Km Actuales</label>
              <input type="number" id="w-km" class="w-full border rounded-lg px-3 py-2 text-sm" required>
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600">Detalles/Observaciones</label>
            <input type="text" id="w-notes" placeholder="Ej: Cambio de aceite 10w40 y filtro" class="w-full border rounded-lg px-3 py-2 text-sm">
          </div>
          <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg font-medium text-sm hover:bg-green-700">+ Guardar Registro</button>
        </form>
      </div>

      <!-- Historial -->
      <div class="border-t pt-4">
        <h4 class="font-bold mb-3">Historial de Servicios</h4>
        <div id="work-history" class="space-y-3 max-h-60 overflow-y-auto pr-2">
          <!-- Carga dinámica -->
        </div>
      </div>
    </div>
  </div>

  <script>
    let allVehicles = [];

    // Helper API
    async function api(url, options = {}) {
      const res = await fetch(url, {
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      if (res.status === 401) window.location.href = '/login.html';
      return res.json();
    }

    // Navegación
    function switchTab(tab) {
      ['vehicles', 'clients', 'services'].forEach(t => {
        document.getElementById(`sec-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = 'px-4 py-2 font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700';
      });
      document.getElementById(`sec-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = 'px-4 py-2 font-medium border-b-2 border-blue-600 text-blue-600';
      
      if (tab === 'vehicles') loadVehicles();
      if (tab === 'clients') loadClients();
      if (tab === 'services') loadServices();
    }

    // Cargar Vehículos
    async function loadVehicles() {
      allVehicles = await api('/api/vehicles');
      renderVehicles(allVehicles);
    }

    // Renderizado táctil optimizado para móviles (usa elementos <button>)
    function renderVehicles(list) {
      document.getElementById('vehicles-list').innerHTML = list.length ? list.map(v => `
        <button type="button" class="w-full text-left p-4 flex justify-between items-center hover:bg-gray-50 active:bg-gray-100 transition-colors border-b last:border-0" onclick="openVehicleDetail(${v.id})">
          <div>
            <p class="font-medium text-lg text-gray-900">${v.plate}</p>
            <p class="text-sm text-gray-600">${v.brand || ''} ${v.model || ''} ${v.year || ''}</p>
            <p class="text-xs text-gray-400">${v.client_name || 'Sin cliente'} · ${v.current_km || 0} km</p>
          </div>
          <span class="text-blue-600 text-sm font-medium pointer-events-none">Ver →</span>
        </button>
      `).join('') : '<p class="p-4 text-gray-400">No hay vehículos</p>';
    }

    function filterVehicles() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const filtered = allVehicles.filter(v => 
        (v.plate && v.plate.toLowerCase().includes(q)) ||
        (v.brand && v.brand.toLowerCase().includes(q)) ||
        (v.model && v.model.toLowerCase().includes(q)) ||
        (v.client_name && v.client_name.toLowerCase().includes(q))
      );
      renderVehicles(filtered);
    }

    // Cargar Clientes
    async function loadClients() {
      const clients = await api('/api/clients');
      document.getElementById('clients-list').innerHTML = clients.length ? clients.map(c => `
        <div class="p-4 flex justify-between items-center border-b last:border-0">
          <div>
            <p class="font-medium text-gray-900">${c.name}</p>
            <p class="text-sm text-gray-500">${c.phone || ''} ${c.email ? '· ' + c.email : ''}</p>
          </div>
          <div class="flex gap-2">
            <button type="button" onclick='editClient(${JSON.stringify(c)})' class="text-blue-600 text-sm p-2 hover:underline">Editar</button>
            <button type="button" onclick="deleteClient(${c.id})" class="text-red-500 text-sm p-2 hover:underline">Eliminar</button>
          </div>
        </div>
      `).join('') : '<p class="p-4 text-gray-400">No hay clientes</p>';
    }

    // Cargar Servicios
    async function loadServices() {
      const services = await api('/api/services');
      document.getElementById('services-list').innerHTML = services.length ? services.map(s => `
        <div class="p-4 flex justify-between items-center border-b last:border-0">
          <div>
            <p class="font-medium text-gray-900">${s.name}</p>
            <p class="text-xs text-gray-400">Intervalo recomendado: ${s.interval_km ? s.interval_km + ' km' : 'No definido'}</p>
          </div>
        </div>
      `).join('') : '<p class="p-4 text-gray-400">No hay servicios registrados</p>';
    }

    // Modal Vehículo
    async function openVehicleModal(vehicle = null) {
      const clients = await api('/api/clients');
      const select = document.getElementById('v-client');
      select.innerHTML = '<option value="">-- Sin cliente --</option>' + 
        clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

      if (vehicle) {
        document.getElementById('modal-vehicle-title').innerText = 'Editar Vehículo';
        document.getElementById('v-id').value = vehicle.id;
        document.getElementById('v-plate').value = vehicle.plate;
        document.getElementById('v-client').value = vehicle.client_id || '';
        document.getElementById('v-brand').value = vehicle.brand || '';
        document.getElementById('v-model').value = vehicle.model || '';
        document.getElementById('v-year').value = vehicle.year || '';
        document.getElementById('v-km').value = vehicle.current_km || '';
      } else {
        document.getElementById('modal-vehicle-title').innerText = 'Nuevo Vehículo';
        document.getElementById('form-vehicle').reset();
        document.getElementById('v-id').value = '';
      }
      document.getElementById('modal-vehicle').classList.remove('hidden');
    }

    async function saveVehicle(e) {
      e.preventDefault();
      const id = document.getElementById('v-id').value;
      const data = {
        plate: document.getElementById('v-plate').value.toUpperCase(),
        client_id: document.getElementById('v-client').value || null,
        brand: document.getElementById('v-brand').value,
        model: document.getElementById('v-model').value,
        year: document.getElementById('v-year').value,
        current_km: document.getElementById('v-km').value
      };

      await api(id ? `/api/vehicles/${id}` : '/api/vehicles', {
        method: id ? 'PUT' : 'POST',
        body: JSON.stringify(data)
      });

      closeModal('modal-vehicle');
      loadVehicles();
    }

    // Abrir Detalle de Vehículo
    async function openVehicleDetail(id) {
      const data = await api(`/api/vehicles/${id}/detail`);
      const v = data.vehicle;
      
      document.getElementById('detail-plate').innerText = v.plate;
      document.getElementById('detail-subtitle').innerText = `${v.brand || ''} ${v.model || ''} · ${v.client_name || 'Sin Cliente'}`;
      document.getElementById('w-vehicle-id').value = v.id;
      document.getElementById('w-km').value = v.current_km || '';

      // Estados de mantenimiento
      const statusMap = { oil: 'status-oil', air: 'status-filter-air', fuel: 'status-filter-fuel', belt: 'status-belt' };
      Object.keys(statusMap).forEach(k => {
        const el = document.getElementById(statusMap[k]);
        if (data.status && data.status[k]) {
          el.innerText = `${data.status[k].last_km} km`;
          el.className = data.status[k].alert ? 'font-semibold text-red-600' : 'font-semibold text-green-600';
        } else {
          el.innerText = 'Sin registro';
          el.className = 'font-semibold text-gray-400';
        }
      });

      // Cargar lista de servicios en el select del modal
      const services = await api('/api/services');
      document.getElementById('w-service').innerHTML = services.map(s => `<option value="${s.id}">${s.name}</option>`).join('');

      // Render Historial
      const historyEl = document.getElementById('work-history');
      historyEl.innerHTML = data.history.length ? data.history.map(h => `
        <div class="bg-gray-50 p-3 rounded-lg flex justify-between items-center text-sm border border-gray-100">
          <div>
            <p class="font-medium text-gray-900">${h.service_name}</p>
            <p class="text-xs text-gray-500">${h.notes || 'Sin observaciones'}</p>
            <span class="text-xs text-gray-400">${new Date(h.date).toLocaleDateString()}</span>
          </div>
          <span class="font-bold text-gray-700">${h.km} km</span>
        </div>
      `).join('') : '<p class="text-gray-400 text-sm">No hay trabajos registrados.</p>';

      document.getElementById('modal-detail').classList.remove('hidden');
    }

    async function saveWork(e) {
      e.preventDefault();
      const vehicleId = document.getElementById('w-vehicle-id').value;
      const data = {
        vehicle_id: vehicleId,
        service_id: document.getElementById('w-service').value,
        km: document.getElementById('w-km').value,
        notes: document.getElementById('w-notes').value
      };

      await api('/api/works', { method: 'POST', body: JSON.stringify(data) });
      document.getElementById('w-notes').value = '';
      openVehicleDetail(vehicleId);
      loadVehicles();
    }

    // Cierre de Modales
    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    async function logout() {
      await api('/api/logout', { method: 'POST' });
      window.location.href = '/login.html';
    }

    // Inicializar app
    loadVehicles();
  </script>
</body>
</html>
