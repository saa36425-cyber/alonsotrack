<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlonsoTrack - Taller Mecánico</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1e40af">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3097/3097180.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- LOGIN -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-900 to-blue-700 px-4">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden">
      <div class="bg-blue-600 text-white p-8 text-center">
        <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-4">
          <span class="text-3xl font-bold">AT</span>
        </div>
        <h1 class="text-3xl font-bold">AlonsoTrack</h1>
        <p class="text-blue-100 mt-1">Historial de Mantenimiento</p>
      </div>
      <div class="p-8">
        <form id="login-form" class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
            <input type="text" id="login-user" class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Usuario" required>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
            <input type="password" id="login-pass" class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Contraseña" required>
          </div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl">Ingresar</button>
        </form>
        <div class="mt-6 pt-6 border-t text-center">
          <button onclick="showClientLogin()" class="text-blue-600 hover:underline text-sm font-medium">¿Sos cliente? Consultá tu historial →</button>
        </div>
      </div>
    </div>
  </div>

  <!-- CLIENT LOGIN -->
  <div id="client-login" class="hidden min-h-screen flex items-center justify-center bg-gray-100 px-4">
    <div class="bg-white rounded-3xl shadow-xl w-full max-w-md p-8">
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl font-bold">AT</div>
        <h2 class="text-2xl font-bold">Consultá tu historial</h2>
        <p class="text-gray-500 text-sm mt-1">Ingresá la patente de tu vehículo</p>
      </div>
      <form id="client-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Patente</label>
          <input type="text" id="client-plate" class="w-full border border-gray-300 rounded-xl px-4 py-3 uppercase text-lg tracking-wider focus:ring-2 focus:ring-blue-500 outline-none" placeholder="ABC123" required>
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-xl font-semibold">Ver historial</button>
      </form>
      <button onclick="showAdminLogin()" class="w-full mt-5 text-gray-500 text-sm hover:underline">← Volver al inicio</button>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="main-app" class="hidden min-h-screen">
    <nav class="bg-white border-b shadow-sm sticky top-0 z-20">
      <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center font-bold">AT</div>
          <div>
            <h1 class="font-bold text-lg">AlonsoTrack</h1>
            <p class="text-xs text-gray-500">Santiago Alonso</p>
          </div>
        </div>
        <button onclick="logout()" class="text-sm px-4 py-2 border border-red-200 text-red-600 rounded-xl hover:bg-red-50">Cerrar sesión</button>
      </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 py-6">
      <div class="flex gap-2 mb-6 overflow-x-auto">
        <button onclick="showView('dashboard')" id="tab-dashboard" class="tab-btn px-5 py-2.5 rounded-xl font-medium bg-blue-600 text-white">Dashboard</button>
        <button onclick="showView('clients')" id="tab-clients" class="tab-btn px-5 py-2.5 rounded-xl font-medium bg-white border">Clientes</button>
        <button onclick="showView('vehicles')" id="tab-vehicles" class="tab-btn px-5 py-2.5 rounded-xl font-medium bg-white border">Vehículos</button>
      </div>

      <div id="view-dashboard" class="space-y-6">
        <div class="grid grid-cols-2 gap-4">
          <div class="bg-white rounded-2xl p-5 shadow-sm border">
            <p class="text-sm text-gray-500">Clientes</p>
            <p id="stat-clients" class="text-3xl font-bold text-blue-600">0</p>
          </div>
          <div class="bg-white rounded-2xl p-5 shadow-sm border">
            <p class="text-sm text-gray-500">Vehículos</p>
            <p id="stat-vehicles" class="text-3xl font-bold text-blue-600">0</p>
          </div>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow-sm border">
          <h3 class="font-semibold mb-4">Próximos mantenimientos</h3>
          <div id="upcoming-list" class="space-y-3 text-sm"></div>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow-sm border">
          <h3 class="font-semibold mb-4">Últimos trabajos</h3>
          <div id="recent-list" class="space-y-3 text-sm"></div>
        </div>
      </div>

      <div id="view-clients" class="hidden">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-bold">Clientes</h2>
          <button onclick="openClientModal()" class="bg-blue-600 text-white px-4 py-2.5 rounded-xl text-sm font-medium">+ Nuevo</button>
        </div>
        <div id="clients-list" class="space-y-3"></div>
      </div>

      <div id="view-vehicles" class="hidden">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-bold">Vehículos</h2>
          <button onclick="openVehicleModal()" class="bg-blue-600 text-white px-4 py-2.5 rounded-xl text-sm font-medium">+ Nuevo</button>
        </div>
        <div id="vehicles-list" class="space-y-3"></div>
      </div>

      <div id="view-maintenances" class="hidden">
        <div class="flex items-center gap-3 mb-4">
          <button onclick="showView('vehicles')" class="text-blue-600 text-sm">← Volver</button>
          <h2 class="text-xl font-bold" id="maint-title">Mantenimientos</h2>
        </div>
        <button onclick="openMaintenanceModal()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-medium mb-4">+ Agregar mantenimiento</button>
        <div id="maintenances-list" class="space-y-3"></div>
      </div>
    </div>
  </div>

  <!-- CLIENT VIEW -->
  <div id="client-view" class="hidden min-h-screen bg-gray-50">
    <div class="bg-blue-600 text-white p-6">
      <h1 class="text-2xl font-bold" id="cv-plate"></h1>
      <p id="cv-info" class="text-blue-100 mt-1"></p>
    </div>
    <div class="p-4 max-w-2xl mx-auto">
      <button onclick="exportClientPDF()" class="w-full bg-white border-2 border-blue-600 text-blue-600 py-3.5 rounded-xl font-semibold mb-5">Descargar PDF del historial</button>
      <div id="cv-maintenances" class="space-y-3"></div>
      <button onclick="location.reload()" class="w-full mt-8 text-gray-500 text-sm">Cerrar</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script>
    const API = '';
    let token = localStorage.getItem('at_token') || '';
    let clients = [], vehicles = [], currentClientData = null, currentVehicleId = null, currentPlate = '';

    // Categorías predeterminadas de servicio
    const SERVICE_TYPES = [
      'Cambio de aceite y filtro',
      'Frenos',
      'Suspensión / Amortiguadores',
      'Correa de distribución',
      'Embrague',
      'Batería / Sistema eléctrico',
      'Neumáticos / Alineación / Balanceo',
      'Aire acondicionado',
      'Diagnóstico / Scanner',
      'Refrigeración / Radiador',
      'Escape',
      'Otros'
    ];

    function showAdminLogin() {
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('client-login').classList.add('hidden');
      document.getElementById('main-app').classList.add('hidden');
      document.getElementById('client-view').classList.add('hidden');
    }
    function showClientLogin() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('client-login').classList.remove('hidden');
    }
    function showApp() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('client-login').classList.add('hidden');
      document.getElementById('main-app').classList.remove('hidden');
      loadDashboard();
    }
    function showView(name) {
      ['dashboard','clients','vehicles','maintenances'].forEach(v => {
        const el = document.getElementById('view-' + v);
        if (el) el.classList.toggle('hidden', v !== name);
      });
      ['dashboard','clients','vehicles'].forEach(v => {
        const tab = document.getElementById('tab-' + v);
        if (tab) tab.className = v === name
          ? 'tab-btn px-5 py-2.5 rounded-xl font-medium bg-blue-600 text-white'
          : 'tab-btn px-5 py-2.5 rounded-xl font-medium bg-white border';
      });
      if (name === 'clients') loadClients();
      if (name === 'vehicles') loadVehicles();
    }

    document.getElementById('login-form').onsubmit = async (e) => {
      e.preventDefault();
      try {
        const res = await fetch(API + '/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('login-user').value.trim(),
            password: document.getElementById('login-pass').value
          })
        });
        const data = await res.json();
        if (!res.ok) return alert(data.error || 'Error al ingresar');
        token = data.token;
        localStorage.setItem('at_token', token);
        showApp();
      } catch (err) {
        alert('Error de conexión. Esperá 40 segundos e intentá de nuevo.');
      }
    };

    document.getElementById('client-form').onsubmit = async (e) => {
      e.preventDefault();
      const plate = document.getElementById('client-plate').value.trim().toUpperCase();
      try {
        const res = await fetch(API + '/api/client-access', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ plate })
        });
        const data = await res.json();
        if (!res.ok) return alert(data.error || 'No se encontró el vehículo');
        currentClientData = data;
        document.getElementById('client-login').classList.add('hidden');
        document.getElementById('client-view').classList.remove('hidden');
        document.getElementById('cv-plate').textContent = data.vehicle.plate;
        document.getElementById('cv-info').textContent = `${data.vehicle.brand || ''} ${data.vehicle.model || ''} · ${data.vehicle.client_name || ''}`.trim();
        document.getElementById('cv-maintenances').innerHTML = data.maintenances.length
          ? data.maintenances.map(m => `
            <div class="bg-white rounded-xl p-4 border shadow-sm">
              <div class="flex justify-between"><span class="font-medium">${m.type || 'Mantenimiento'}</span><span class="text-sm text-gray-500">${m.date}</span></div>
              <p class="text-sm text-gray-600 mt-1">${m.description || ''}</p>
              ${m.km ? `<p class="text-xs text-gray-500 mt-1">Km: ${m.km}</p>` : ''}
              ${m.next_date ? `<p class="text-xs text-blue-600 mt-1 font-medium">Próximo: ${m.next_date}</p>` : ''}
            </div>`).join('')
          : '<p class="text-center text-gray-500 py-10">Todavía no hay historial registrado</p>';
      } catch (err) {
        alert('Error de conexión');
      }
    };

    function logout() {
      localStorage.removeItem('at_token');
      token = '';
      location.reload();
    }

    async function api(path, options = {}) {
      const res = await fetch(API + path, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token,
          ...(options.headers || {})
        }
      });
      if (res.status === 401) { logout(); return null; }
      return res.json();
    }

    async function loadDashboard() {
      const data = await api('/api/dashboard');
      if (!data) return;
      document.getElementById('stat-clients').textContent = data.totalClients;
      document.getElementById('stat-vehicles').textContent = data.totalVehicles;
      document.getElementById('upcoming-list').innerHTML = data.upcoming.length
        ? data.upcoming.map(m => `<div class="flex justify-between py-2.5 border-b"><span>${m.plate} · ${m.client_name}</span><span class="text-blue-600 font-medium">${m.next_date}</span></div>`).join('')
        : '<p class="text-gray-400">No hay próximos mantenimientos</p>';
      document.getElementById('recent-list').innerHTML = data.recent.length
        ? data.recent.map(m => `<div class="flex justify-between py-2.5 border-b"><span>${m.plate} · ${m.type || 'Trabajo'}</span><span class="text-gray-500">${m.date}</span></div>`).join('')
        : '<p class="text-gray-400">Sin trabajos recientes</p>';
    }

    async function loadClients() {
      clients = await api('/api/clients') || [];
      document.getElementById('clients-list').innerHTML = clients.length
        ? clients.map(c => `
          <div class="bg-white rounded-xl p-4 border flex justify-between items-center">
            <div><p class="font-medium">${c.name}</p><p class="text-sm text-gray-500">${c.phone || ''}</p></div>
            <button onclick="deleteClient('${c.id}')" class="text-red-500 text-sm">Eliminar</button>
          </div>`).join('')
        : '<p class="text-center text-gray-400 py-10">No hay clientes</p>';
    }

    async function loadVehicles() {
      vehicles = await api('/api/vehicles') || [];
      document.getElementById('vehicles-list').innerHTML = vehicles.length
        ? vehicles.map(v => `
          <div class="bg-white rounded-xl p-4 border">
            <div class="flex justify-between items-start">
              <div>
                <p class="font-bold text-lg">${v.plate}</p>
                <p class="text-sm text-gray-600">${v.brand || ''} ${v.model || ''} · ${v.client_name || ''}</p>
              </div>
              <div class="flex gap-3">
                <button onclick="openMaintenances('${v.id}', '${v.plate}')" class="text-blue-600 text-sm font-medium">Mantenimientos</button>
                <button onclick="deleteVehicle('${v.id}')" class="text-red-500 text-sm">Eliminar</button>
              </div>
            </div>
          </div>`).join('')
        : '<p class="text-center text-gray-400 py-10">No hay vehículos</p>';
    }

    async function openMaintenances(vehicleId, plate) {
      currentVehicleId = vehicleId;
      currentPlate = plate;
      document.getElementById('maint-title').textContent = 'Mantenimientos · ' + plate;
      showView('maintenances');
      const list = await api('/api/vehicles/' + vehicleId + '/maintenances') || [];
      document.getElementById('maintenances-list').innerHTML = list.length
        ? list.map(m => `
          <div class="bg-white rounded-xl p-4 border">
            <div class="flex justify-between">
              <span class="font-medium">${m.type || 'Mantenimiento'}</span>
              <span class="text-sm text-gray-500">${m.date}</span>
            </div>
            <p class="text-sm text-gray-600 mt-1">${m.description || ''}</p>
            ${m.km ? `<p class="text-xs text-gray-500 mt-1">Km: ${m.km}</p>` : ''}
            ${m.next_date ? `<p class="text-xs text-blue-600 mt-1">Próximo: ${m.next_date}</p>` : ''}
            <div class="flex gap-4 mt-3">
              <button onclick='editMaintenance(${JSON.stringify(m)})' class="text-blue-600 text-sm font-medium">Editar</button>
              <button onclick="deleteMaintenance('${m.id}')" class="text-red-500 text-sm">Eliminar</button>
            </div>
          </div>`).join('')
        : '<p class="text-center text-gray-400 py-8">Todavía no hay mantenimientos</p>';
    }

    function openClientModal() {
      const name = prompt('Nombre del cliente:');
      if (!name) return;
      const phone = prompt('Teléfono (opcional):') || '';
      api('/api/clients', { method: 'POST', body: JSON.stringify({ name, phone }) }).then(loadClients);
    }

    function openVehicleModal() {
      if (!clients.length) return alert('Primero creá un cliente');
      const list = clients.map((c, i) => `${i+1}. ${c.name}`).join('\n');
      const idx = prompt('Elegí el número del cliente:\n' + list);
      if (!idx) return;
      const client = clients[parseInt(idx)-1];
      if (!client) return alert('Número inválido');
      const plate = prompt('Patente:');
      if (!plate) return;
      const brand = prompt('Marca (opcional):') || '';
      const model = prompt('Modelo (opcional):') || '';
      api('/api/vehicles', { method: 'POST', body: JSON.stringify({ client_id: client.id, plate, brand, model }) })
        .then(() => { alert('Vehículo creado'); loadVehicles(); });
    }

    function openMaintenanceModal(existing = null) {
      if (!currentVehicleId) return;

      // Elegir tipo de servicio
      let typeList = SERVICE_TYPES.map((t, i) => `${i + 1}. ${t}`).join('\n');
      let typeChoice = prompt('Elegí el tipo de servicio:\n\n' + typeList + '\n\nEscribí el número:', existing && existing.type ? '' : '1');
      if (typeChoice === null) return;

      let type = '';
      const num = parseInt(typeChoice);
      if (num >= 1 && num <= SERVICE_TYPES.length) {
        type = SERVICE_TYPES[num - 1];
        if (type === 'Otros') {
          type = prompt('Escribí el tipo de servicio:') || 'Otros';
        }
      } else {
        type = typeChoice || (existing ? existing.type : 'Otros');
      }

      const date = prompt('Fecha (AAAA-MM-DD):', existing ? existing.date : new Date().toISOString().slice(0,10));
      if (!date) return;

      const description = prompt('Descripción / detalles:', existing ? existing.description || '' : '') || '';
      const km = prompt('Kilometraje:', existing && existing.km ? existing.km : '') || null;
      const next_date = prompt('Próximo mantenimiento (AAAA-MM-DD):', existing ? existing.next_date || '' : '') || null;

      const body = {
        date,
        type,
        description,
        km: km ? Number(km) : null,
        next_date: next_date || null
      };

      if (existing) {
        api('/api/maintenances/' + existing.id, { method: 'PUT', body: JSON.stringify(body) })
          .then(() => {
            alert('Mantenimiento actualizado');
            openMaintenances(currentVehicleId, currentPlate);
          });
      } else {
        body.vehicle_id = currentVehicleId;
        api('/api/maintenances', { method: 'POST', body: JSON.stringify(body) })
          .then(() => {
            alert('Mantenimiento guardado');
            openMaintenances(currentVehicleId, currentPlate);
          });
      }
    }

    function editMaintenance(m) {
      openMaintenanceModal(m);
    }

    async function deleteClient(id) {
      if (!confirm('¿Eliminar cliente?')) return;
      await api('/api/clients/' + id, { method: 'DELETE' });
      loadClients();
    }
    async function deleteVehicle(id) {
      if (!confirm('¿Eliminar vehículo?')) return;
      await api('/api/vehicles/' + id, { method: 'DELETE' });
      loadVehicles();
    }
    async function deleteMaintenance(id) {
      if (!confirm('¿Eliminar este registro?')) return;
      await api('/api/maintenances/' + id, { method: 'DELETE' });
      openMaintenances(currentVehicleId, currentPlate);
    }

    function exportClientPDF() {
      if (!currentClientData) return;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(16);
      doc.text('AlonsoTrack - Historial', 14, 20);
      doc.setFontSize(11);
      doc.text(`Patente: ${currentClientData.vehicle.plate}`, 14, 30);
      doc.text(`Cliente: ${currentClientData.vehicle.client_name || '-'}`, 14, 37);
      doc.text(`Vehículo: ${currentClientData.vehicle.brand || ''} ${currentClientData.vehicle.model || ''}`, 14, 44);

      const rows = currentClientData.maintenances.map(m => [
        m.date || '',
        m.type || '',
        m.description || '',
        m.km ? String(m.km) : '-',
        m.next_date || '-'
      ]);

      doc.autoTable({
        startY: 52,
        head: [['Fecha', 'Tipo', 'Descripción', 'Km', 'Próximo']],
        body: rows,
        styles: { fontSize: 9 }
      });
      doc.save(`historial_${currentClientData.vehicle.plate}.pdf`);
    }

    if (token) showApp();
  </script>
</body>
</html>
